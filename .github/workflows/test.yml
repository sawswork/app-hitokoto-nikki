# test — 自動チェックとテスト(Linux)
# mainへのプッシュとプルリクエストのたびに実行する。開発ループの合否判定に使う。
# Flutterのプロジェクト(pubspec.yaml)がまだ無いうちは、何もせず合格扱いにする。
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Flutterを準備
        if: hashFiles('pubspec.yaml') != ''
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 自動チェックとテスト
        if: hashFiles('pubspec.yaml') != ''
        run: |
          flutter pub get
          flutter analyze
          flutter test
